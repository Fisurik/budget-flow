<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Budget Flow</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">SEPTEMBER BUDGET</p>
        <h1>Budget Flow</h1>
      </div>
      <button id="resetBtn" class="ghost-btn" aria-label="Сбросить месяц">Reset</button>
    </header>

    <section class="hero-card">
      <p class="muted">Осталось в этом месяце</p>
      <div id="remainingTotal" class="hero-amount">$0</div>
      <div class="hero-row">
        <span id="spentTotal">Потрачено $0</span>
        <span id="budgetTotal">Бюджет $0</span>
      </div>
    </section>

    <section class="entry-card">
      <label for="expenseInput">Что ты потратил?</label>
      <div class="input-row">
        <input id="expenseInput" autocomplete="off" placeholder="Publix 54 продукты" />
        <button id="addBtn" class="primary-btn">Добавить</button>
      </div>
      <p class="hint">Примеры: “BP 40 gas”, “Chick-fil-A 28”, “Home Depot 120 materials”.</p>
      <div class="scope-toggle" role="group" aria-label="Тип расхода">
        <button class="scope-btn active" data-scope="personal">Family</button>
        <button class="scope-btn" data-scope="business">Business</button>
      </div>
    </section>

    <section>
      <div class="section-title-row">
        <h2>Категории</h2>
        <span class="muted">+10% cushion</span>
      </div>
      <div id="categoryList" class="category-list"></div>
    </section>

    <section>
      <div class="section-title-row">
        <h2>Последние траты</h2>
        <button id="clearTransactionsBtn" class="link-btn">Очистить</button>
      </div>
      <div id="transactions" class="transactions"></div>
    </section>
  </main>

  <dialog id="editDialog">
    <form method="dialog" class="dialog-card" id="editForm">
      <h3>Проверить расход</h3>
      <label>Сумма
        <input id="editAmount" type="number" step="0.01" min="0" required />
      </label>
      <label>Категория
        <select id="editCategory"></select>
      </label>
      <label>Описание
        <input id="editDescription" />
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="ghost-btn">Отмена</button>
        <button id="saveExpenseBtn" value="default" class="primary-btn">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
